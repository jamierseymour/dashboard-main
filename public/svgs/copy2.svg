<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"
    style="width: 150px; height: 150px;">
    <style>
        .line-copy2-1 {
            animation: line-copy2-1 3s infinite;
        }

        @keyframes line-copy2-1 {
            0% {
                transform: translate3d(0, 0, 0);
            }

            20% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(10px, -10px, 0);
            }

            70% {
                transform: translate3d(10px, -10px, 0);
            }

            100% {
                transform: translate3d(0, 0, 0);
            }
        }

        .line-copy2-2 {
            animation: line-copy2-2 3s infinite;
        }

        @keyframes line-copy2-2 {
            0% {
                transform: translate3d(0, 0, 0);
            }

            20% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(5px, -5px, 0);
            }

            70% {
                transform: translate3d(5px, -5px, 0);
            }

            100% {
                transform: translate3d(0, 0, 0);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .line-copy2-1,
            .line-copy2-2 {
                animation: none;
            }
        }
    </style>
    <rect class="stroke1 fill1" x="15" y="20" width="58" height="72" rx="4" fill="#fff" stroke="rgba(133,167,128,1)"
