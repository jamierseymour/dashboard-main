     @keyframes confusion3-bounce1 {
         0%{transform:translate3d(0, 4px, 0);}
         40%{transform:translate3d(0, -6px, 0);}
         100%{transform:translate3d(0, 4px, 0);}
     }

     @keyframes confusion3-bounce2 {
         0%{transform:translate3d(0, 4px, 0);}
         50%{transform:translate3d(0, -6px, 0);}
         100%{transform:translate3d(0, 4px, 0);}
     }

     @keyframes confusion3-bounce3 {
         0%{transform:translate3d(0, 4px, 0);}
         60%{transform:translate3d(0, -6px, 0);}
         100%{transform:translate3d(0, 4px, 0);}
     }
     
     @media (prefers-reduced-motion: reduce) {
         .confusion3-a, .confusion3-b, .confusion3-c {
             animation: none;
         }
     }
