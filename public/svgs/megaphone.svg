<svg width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 150px; height: 150px;"><style>
     .megaphone3-a {animation:megaphone3-a 2s infinite;}
     .megaphone3-b {animation:megaphone3-b 2s infinite;}
     .megaphone3-c {animation:megaphone3-c 2s infinite;}
     @keyframes megaphone3-a {
         0%{opacity: 0;}
         20%{transform:translate3d(0, 0, 0); opacity: 0;}
         60%{opacity: .8;}
         70%{transform:translate3d(0, -4px, 0); opacity: .8;}
         90%{opacity: 0;}
         100%{transform:translate3d(0, -4px, 0); opacity: 0;}
     }
     @keyframes megaphone3-b {
         0%{opacity: 0;}
         20%{transform:translate3d(0, 0, 0); opacity: 0;}
         60%{opacity: .8;}
         70%{transform:translate3d(-4px, -4px, 0); opacity: .8;}
         90%{opacity: 0;}
         100%{transform:translate3d(-4px, -4px, 0); opacity: 0;}
     }
     @keyframes megaphone3-c {
         0%{opacity: 0;}
         20%{transform:translate3d(0, 0, 0); opacity: 0;}
         60%{opacity: .8;}
         70%{transform:translate3d(-4px, 0, 0); opacity: .8;}
         90%{opacity: 0;}
         100%{transform:translate3d(-4px, 0, 0); opacity: 0;}
     }
     @media (prefers-reduced-motion: reduce) {
         .megaphone3-a, .megaphone3-b, .megaphone3-c {
             animation: none;
         }
     }
