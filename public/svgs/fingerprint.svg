<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 32px; height: 32px;"><style>
     .line-touchid2 {animation:line-touchid2-fingerprint 3s infinite; stroke-dasharray: 80;}
     .line-touchid2-tick {animation:line-touchid2-tick 3s infinite; stroke-dasharray: 80;}
     .line-touchid2-circle {animation:line-touchid2-circle 3s infinite;}
     @keyframes line-touchid2-fingerprint {
         0%{stroke-dashoffset: 90;}
         100%{stroke-dashoffset: 0;}
     }
     @keyframes line-touchid2-tick {
         0%{stroke-dashoffset: 90;}
         60%{stroke-dashoffset: 90;}
         100%{stroke-dashoffset: 0;}
     }
     @keyframes line-touchid2-circle {
         0%{opacity: 0;}
         50%{opacity: 0;}
         60%{opacity: 1;}
         100%{opacity: 1;}
     }
     @media (prefers-reduced-motion: reduce) {
         .line-touchid2, .line-touchid2-tick, .line-touchid2-circle {
             animation: none;
         }
     }
