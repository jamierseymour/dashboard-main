<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"
    style="width: 150px; height: 150px;">
    <style>
        .line-radar1-scanner {
            animation: line-radar1-scanner 4s infinite linear;
            transform-origin: 50px 50px;
        }

        @keyframes line-radar1-scanner {
            100% {
                transform: rotate(360deg);
            }
        }

        .line-radar1-pulse1 {
            animation: line-radar1-pulse 4s 2s infinite;
            opacity: 0;
        }

        .line-radar1-pulse2 {
            animation: line-radar1-pulse 4s 1s infinite;
            opacity: 0;
        }

        .line-radar1-pulse3 {
            animation: line-radar1-pulse 4s infinite;
            opacity: 0;
        }

        @keyframes line-radar1-pulse {
            25% {
                opacity: 0;
            }

            30% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .line-radar1-scanner,
            .line-radar1-pulse1,
            .line-radar1-pulse2,
            .line-radar1-pulse3 {
                animation: none;
            }
        }
    </style>
    <circle class="stroke1 fill1" cx="50" cy="50" r="46" fill="#81ABFC" stroke="#000" stroke-width="2px"
        style="animation-duration: 4s;"></circle>
    <circle class="stroke1 fill1" cx="50" cy="50" r="34.96" fill="#7F90BC" stroke="#000" stroke-width="2px"
        style="animation-duration: 4s;"></circle>
    <circle class="stroke1 fill1" cx="50.0001" cy="50.0001" r="23.92" fill="#80D8FF" stroke="#000" stroke-width="2px"
        style="animation-duration: 4s;"></circle>
    <circle class="line-radar1-pulse3 stroke2 fill2" cx="76.6799" cy="71.1599" r="5.52" fill="#3f51b5" stroke="#000"
        stroke-width="2px" style="animation-duration: 4s;"></circle>
    <circle class="line-radar1-pulse2 stroke2 fill2" cx="14.1201" cy="77.6001" r="5.52" fill="#3f51b5" stroke="#000"
        stroke-width="2px" style="animation-duration: 4s;"></circle>
    <circle class="line-radar1-pulse1 stroke2 fill2" cx="32.52" cy="35.28" r="5.52" fill="#3f51b5" stroke="#000"
        stroke-width="2px" style="animation-duration: 4s;"></circle>
    <path class="line-radar1-scanner stroke1" d="M50.0002 50.0002L81.5496 17.1496" stroke="#000" stroke-width="2px"
        style="animation-duration: 4s;"></path>
</svg>